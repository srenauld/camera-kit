# React Native's CLI, Metro, Gradle autolinking, and CocoaPods require real
# filesystem paths. Yarn Plug'n'Play stores packages in zip archives, which
# makes the CLI's setup_env.sh non-executable (ENOTDIR).
nodeLinker: node-modules
# Android's React Native Gradle settings resolves ../node_modules relative to
# rnapp/android, so native dependencies must remain in rnapp/node_modules
# instead of being hoisted to the monorepo root.
nmHoistingLimits: workspaces
